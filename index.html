    <!--
      Restores the original path after public/404.html has bounced a deep
      link through as a query string. GitHub Pages has no server-side SPA
      fallback, so without this pair a direct visit to /careers returns a
      hard 404. Must run before the app mounts.
    -->
    <script>
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&')
            })
            .join('?')
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash)
        }
      })(window.location)
    </script>
